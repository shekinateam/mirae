<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 도우미</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f0f2f5;
      font-family: 'Segoe UI', sans-serif;
    }
    .box {
      background: #fff;
      border-radius: 12px;
      padding: 40px 48px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      min-width: 360px;
    }
    .label { font-size: 13px; color: #888; margin-bottom: 24px; }
    .row { margin-bottom: 16px; }
    .row-title { font-size: 12px; color: #aaa; margin-bottom: 6px; text-align: left; }
    .link {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a90e2;
      background: #f5f7fa;
      border: 1.5px solid #d0d7e2;
      border-radius: 8px;
      padding: 12px 16px;
      text-decoration: none;
      word-break: break-all;
      text-align: left;
      transition: border-color 0.2s, background 0.2s;
    }
    .link:hover { border-color: #4a90e2; background: #eaf2ff; }
    .copy-wrap {
      display: flex;
      align-items: center;
      background: #f5f7fa;
      border: 1.5px solid #d0d7e2;
      border-radius: 8px;
      overflow: hidden;
    }
    .copy-wrap:hover { border-color: #4a90e2; }
    .copy-text {
      flex: 1;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      text-align: left;
      user-select: all;
      cursor: text;
    }
    .copy-btn {
      padding: 12px 16px;
      background: #4a90e2;
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .copy-btn:hover { background: #357abd; }
    .toast {
      margin-top: 14px;
      font-size: 13px;
      color: #27ae60;
      opacity: 0;
      transition: opacity 0.3s;
      min-height: 18px;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="box">
    <div class="label">아이디/비밀번호 복사 후 로그인하세요</div>

    <div class="row">
      <div class="row-title">🌐 관리자 페이지 (클릭하면 접속)</div>
      <a class="link" href="https://medam.dycis.co.kr/admin" target="_blank">
        https://medam.dycis.co.kr/admin
      </a>
    </div>

    <div class="row">
      <div class="row-title">👤 아이디</div>
      <div class="copy-wrap">
        <div class="copy-text">display</div>
        <button class="copy-btn" onclick="copyText('display', '아이디')">📋 복사</button>
      </div>
    </div>

    <div class="row">
      <div class="row-title">🔑 비밀번호</div>
      <div class="copy-wrap">
        <div class="copy-text">qwer!@#$</div>
        <button class="copy-btn" onclick="copyText('qwer!@#$', '비밀번호')">📋 복사</button>
      </div>
    </div>

    <div class="row">
      <div class="row-title">🖼️ 이미지 다운로드 (클릭하면 접속)</div>
      <a class="link" href="https://drive.google.com/drive/mobile/folders/1yNO-C4vLdEh8fln7Z_KcZpeuKVNt87PQ?usp=sharing" target="_blank">
        https://drive.google.com/drive/mobile/folders/1yNO-C4vLdEh8fln7Z_KcZpeuKVNt87PQ?usp=sharing
      </a>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    function copyText(val, label) {
      navigator.clipboard.writeText(val);
      const t = document.getElementById('toast');
      t.textContent = '✅ ' + label + '가 복사되었습니다!';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
