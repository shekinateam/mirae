```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 도우미</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f0f2f5;
      font-family: 'Segoe UI', sans-serif;

      background: #fff;

      text-align: center;
      min-width: 360px;
    }

    .label {
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
    }

    .row { margin-bottom: 16px; }

    .row-title {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
      text-align: left;
    }

    .link {
      display: block;
      padding: 12px 16px;
      border: 1.5px solid #d0d7e2;
      border-radius: 8px;
      background: #f5f7fa;
      color: #4a90e2;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      text-decoration: none;
      word-break: break-all;
      transition: border-color 0.2s, background 0.2s;
    }

    .link:hover {
      border-color: #4a90e2;
      background: #eaf2ff;
    }

    .copy-wrap {
      display: flex;
      align-items: center;
      overflow: hidden;
      border: 1.5px solid #d0d7e2;
      border-radius: 8px;
      background: #f5f7fa;
    }

    .copy-wrap:hover { border-color: #4a90e2; }

    .copy-text {
      flex: 1;
      padding: 12px 16px;
      color: #1a1a1a;
      cursor: text;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      user-select: all;
    }

    .copy-btn {
      padding: 12px 16px;
      border: none;
      background: #4a90e2;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .copy-btn:hover { background: #357abd; }

    .dl-btn {
      display: block;
      padding: 12px 16px;
      border-radius: 8px;
      background: #27ae60;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
    }

    .dl-btn:hover { background: #1e8449; }

    .toast {
      min-height: 18px;
      margin-top: 14px;
      color: #27ae60;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .toast.show { opacity: 1; }

</head>

<body>

  <script>
    function copyText(val, label) {
      navigator.clipboard.writeText(val);

      const toast = document.getElementById('toast');
      toast.textContent = '✅ ' + label + '가 복사되었습니다!';
      toast.classList.add('show');

      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>

</html>
